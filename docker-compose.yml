services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: obliplan
      POSTGRES_USER: obliplan
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Uncomment to expose the DB on the LAN (pgAdmin / running migrations from host).
    #ports:
    #  - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obliplan"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  server:
    image: meejay/obliplan-server:${OBLIPLAN_VERSION:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgres://obliplan:${DB_PASSWORD:-changeme}@postgres:5432/obliplan
      SESSION_SECRET: ${SESSION_SECRET:-change-this-in-production}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      APP_NAME: Obliplan
      # Public base URL — used for ICS subscribe links, push & e-mail links.
      APP_URL: ${APP_URL:-http://localhost}
      # Web Push (PWA notifications) — OPTIONAL; push stays DISABLED until both keys are set.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@obliplan.local}
      # Audit-log HMAC key — OPTIONAL; falls back to SESSION_SECRET when empty.
      AUDIT_LOG_SECRET: ${AUDIT_LOG_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3003/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    image: meejay/obliplan-client:${OBLIPLAN_VERSION:-latest}
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${LISTEN_PORT:-3002}:80"

volumes:
  postgres_data:
